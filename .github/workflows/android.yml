name: Android APK bauen

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Spiel bauen (JavaScript)
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../ClashCraft.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ClashCraft-APK
          path: ClashCraft.apk

      - name: APK ins Repository legen (apk/ClashCraft.apk)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p apk
          cp ClashCraft.apk apk/ClashCraft.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/ClashCraft.apk
          git commit -m "APK aktualisiert (Build ${{ github.run_number }}) [skip ci]" || echo "keine Aenderung"
          git push

      - name: Release mit APK veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ClashCraft 1.0.${{ github.run_number }}
          body: |
            ClashCraft APK fuer Android (ab Android 8): Block-Arena-Kartenkampf + Blockwelt-Sandbox.
            Auf dem Handy herunterladen und installieren ("Installation aus unbekannten Quellen" erlauben).
          files: ClashCraft.apk
          make_latest: true
